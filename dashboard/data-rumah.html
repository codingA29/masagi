<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Rumah - MASAGI</title>

    <link
        rel="stylesheet"
        href="../style/style.css">
</head>


<body class="data-rumah-page">


<!-- =====================================================
     MAIN
===================================================== -->

<main class="data-rumah-only">


    <!-- =================================================
         TOMBOL KEMBALI
    ================================================== -->

    <div class="data-rumah-back">

        <a
            href="#"
            class="btn-back-dashboard"
            onclick="kembaliKeDashboard(event)">

             ← Dashboard

        </a>

    </div>



    <!-- =================================================
         DATA RUMAH
    ================================================== -->

    <section class="table-container">


        <div class="table-header">


            <div>

                <h2>
                    Data Rumah
                </h2>

                <p>
                    Status Pemilahan Sampah
                </p>

            </div>



            <div class="filter-area">


                <!-- SEARCH -->

                <input
                    type="text"
                    id="cariData"
                    placeholder="Cari ID atau alamat..."
                    onkeyup="filterData()">



                <!-- FILTER RW -->

                <select
                    id="filterRW"
                    onchange="filterData()">

                    <option value="">
                        Semua RW
                    </option>

                </select>



                <!-- FILTER STATUS -->

                <select
                    id="filterStatus"
                    onchange="filterData()">

                    <option value="">
                        Semua Status
                    </option>

                    <option value="Sudah Memilah">
                        Sudah Memilah
                    </option>

                    <option value="Belum Memilah">
                        Belum Memilah
                    </option>

                </select>


            </div>


        </div>



        <div class="table-scroll">


            <table>


                <thead>

                    <tr>

                        <th>No</th>

                        <th>ID Rumah</th>

                        <th>Alamat</th>

                        <th>RT</th>

                        <th>RW</th>

                        <th>Status Pemilahan</th>

                        <th>Tanggal Laporan</th>

                    </tr>

                </thead>



                <tbody id="tabelDataRumah">
                </tbody>


            </table>


        </div>


    </section>


</main>



<!-- =====================================================
     DATA
===================================================== -->

<script
    src="../data/data.js">
</script>



<script>


// ======================================================
// TABEL
// ======================================================

function tampilkanData(data) {


    const tabel =
        document.getElementById(
            "tabelDataRumah"
        );


    tabel.innerHTML =
        "";



    if (data.length === 0) {


        tabel.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:30px;
                        color:#667085;
                    ">

                    Data tidak ditemukan.

                </td>

            </tr>

        `;


        return;

    }



    data.forEach(
        (rumah, index) => {


            const kelasStatus =
                rumah.status ===
                "Sudah Memilah"

                    ? "sudah"

                    : "belum";



            tabel.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${rumah.id}
                    </td>

                    <td>
                        ${rumah.alamat}
                    </td>

                    <td>
                        RT ${rumah.rt}
                    </td>

                    <td>
                        RW ${rumah.rw}
                    </td>

                    <td>

                        <span
                            class="status ${kelasStatus}">

                            ${rumah.status}

                        </span>

                    </td>

                    <td>
                        ${rumah.tanggal}
                    </td>

                </tr>

            `;

        }
    );

}



// ======================================================
// FILTER RW
// ======================================================

function buatFilterRW() {


    const selectRW =
        document.getElementById(
            "filterRW"
        );



    const daftarRW = [

        ...new Set(

            dataRumah.map(
                rumah =>
                    String(rumah.rw)
            )

        )

    ];



    daftarRW.sort(
        (a, b) =>
            Number(a) -
            Number(b)
    );



    daftarRW.forEach(
        rw => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rw;


            option.textContent =
                "RW " + rw;


            selectRW.appendChild(
                option
            );

        }
    );

}



// ======================================================
// FILTER
// ======================================================

function filterData() {


    const keyword =
        document
            .getElementById(
                "cariData"
            )
            .value
            .toLowerCase()
            .trim();



    const rw =
        document
            .getElementById(
                "filterRW"
            )
            .value;



    const status =
        document
            .getElementById(
                "filterStatus"
            )
            .value;



    const hasil =
        dataRumah.filter(
            rumah => {


                const id =
                    String(
                        rumah.id || ""
                    ).toLowerCase();


                const alamat =
                    String(
                        rumah.alamat || ""
                    ).toLowerCase();


                const rt =
                    String(
                        rumah.rt || ""
                    ).toLowerCase();


                const rwRumah =
                    String(
                        rumah.rw || ""
                    ).toLowerCase();



                const cocokCari =

                    id.includes(keyword)

                    ||

                    alamat.includes(keyword)

                    ||

                    rt.includes(keyword)

                    ||

                    rwRumah.includes(keyword);



                const cocokRW =

                    rw === ""

                    ||

                    String(rumah.rw) ===
                    rw;



                const cocokStatus =

                    status === ""

                    ||

                    rumah.status ===
                    status;



                return (

                    cocokCari

                    &&

                    cocokRW

                    &&

                    cocokStatus

                );

            }
        );



    tampilkanData(
        hasil
    );

}

// ======================================================
// KEMBALI KE DASHBOARD SEBELUMNYA
// ======================================================

function kembaliKeDashboard(event) {

    event.preventDefault();

    // Jika halaman Data Rumah dibuka dari halaman sebelumnya,
    // kembali ke halaman tersebut.
    if (document.referrer) {

        window.history.back();

    } else {

        // Jika Data Rumah dibuka langsung,
        // arahkan ke dashboard publik.
        window.location.href =
            "../dashboard-publik.html";

    }

}

// ======================================================
// START
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {


        buatFilterRW();


        tampilkanData(
            dataRumah
        );

    }
);


</script>


</body>

</html>
