<script>


// ======================================================
// ELEMENT
// ======================================================

const tbody =
    document.getElementById(
        "dataRumahBody"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const filterRW =
    document.getElementById(
        "filterRW"
    );


const filterRT =
    document.getElementById(
        "filterRT"
    );


const filterStatus =
    document.getElementById(
        "filterStatus"
    );


const jumlahData =
    document.getElementById(
        "jumlahData"
    );



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";

    }


    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



// ======================================================
// NILAI KOSONG
// ======================================================

function tampilkanNilai(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "-";

    }


    return escapeHTML(
        value
    );

}



// ======================================================
// NORMALISASI RT/RW
// ======================================================

function formatNomorWilayah(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "";

    }


    return String(
        value
    ).padStart(
        2,
        "0"
    );

}



// ======================================================
// ISI FILTER RW
// ======================================================

function isiFilterRW() {


    const daftarRW = [

        ...new Set(

            dataRumah

            .map(
                rumah =>
                    formatNomorWilayah(
                        rumah.rw
                    )
            )

            .filter(
                rw =>
                    rw !== ""
            )

        )

    ].sort(
        (
            a,
            b
        ) =>
            Number(a) -
            Number(b)
    );


    daftarRW.forEach(
        rw => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rw;


            option.textContent =
                "RW " +
                rw;


            filterRW.appendChild(
                option
            );


        }
    );

}



// ======================================================
// ISI FILTER RT
// ======================================================

function isiFilterRT() {


    const daftarRT = [

        ...new Set(

            dataRumah

            .map(
                rumah =>
                    formatNomorWilayah(
                        rumah.rt
                    )
            )

            .filter(
                rt =>
                    rt !== ""
            )

        )

    ].sort(
        (
            a,
            b
        ) =>
            Number(a) -
            Number(b)
    );


    daftarRT.forEach(
        rt => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rt;


            option.textContent =
                "RT " +
                rt;


            filterRT.appendChild(
                option
            );


        }
    );

}



// ======================================================
// STATUS CLASS
// ======================================================

function dapatkanStatusClass(
    status
) {


    if (
        status ===
        "Sudah Memilah"
    ) {

        return "status-sudah";

    }


    if (
        status ===
        "Mengolah"
    ) {

        return "status-mengolah";

    }


    return "status-belum";

}



// ======================================================
// RENDER TABLE
// ======================================================

function renderTable(
    data
) {


    tbody.innerHTML =
        "";


    jumlahData.textContent =
        data.length;



    // ==================================================
    // DATA TIDAK DITEMUKAN
    // ==================================================

    if (
        data.length === 0
    ) {


        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

            <td
                colspan="10"
                class="empty-data">

                Data tidak ditemukan.

            </td>

        `;


        tbody.appendChild(
            tr
        );


        return;

    }



    // ==================================================
    // DATA
    // ==================================================

    data.forEach(
        (
            rumah,
            index
        ) => {


            const tr =
                document.createElement(
                    "tr"
                );


            const rt =
                formatNomorWilayah(
                    rumah.rt
                );


            const rw =
                formatNomorWilayah(
                    rumah.rw
                );


            const statusClass =
                dapatkanStatusClass(
                    rumah.status
                );



            tr.innerHTML = `


                <!-- NO -->

                <td class="nomor-cell">

                    ${index + 1}

                </td>



                <!-- ID -->

                <td>

                    <span class="id-rumah">

                        ${tampilkanNilai(
                            rumah.id
                        )}

                    </span>

                </td>



                <!-- ALAMAT -->

                <td>

                    ${tampilkanNilai(
                        rumah.alamat
                    )}

                </td>



                <!-- NAMA -->

                <td>

                    <span class="nama-warga">

                        ${tampilkanNilai(
                            rumah.namaKepalaRumahTangga
                        )}

                    </span>

                </td>



                <!-- RT -->

                <td>

                    <span class="badge-rt-rw">

                        RT ${escapeHTML(
                            rt
                        )}

                    </span>

                </td>



                <!-- RW -->

                <td>

                    <span class="badge-rt-rw">

                        RW ${escapeHTML(
                            rw
                        )}

                    </span>

                </td>



                <!-- STATUS -->

                <td>

                    <span class="${statusClass}">

                        ${tampilkanNilai(
                            rumah.status
                        )}

                    </span>

                </td>



                <!-- PETUGAS -->

                <td class="petugas-cell">

                    ${tampilkanNilai(
                        rumah.petugasMonitoring
                    )}

                </td>



                <!-- JUMLAH KK -->

                <td class="center-cell">

                    ${tampilkanNilai(
                        rumah.jumlahKK
                    )}

                </td>



                <!-- JUMLAH JIWA -->

                <td class="center-cell">

                    ${tampilkanNilai(
                        rumah.jumlahJiwa
                    )}

                </td>


            `;


            tbody.appendChild(
                tr
            );


        }
    );

}



// ======================================================
// FILTER DATA
// ======================================================

function filterData() {


    const keyword =

        searchInput
        .value
        .trim()
        .toLowerCase();



    const rwDipilih =

        filterRW.value;



    const rtDipilih =

        filterRT.value;



    const statusDipilih =

        filterStatus.value;



    const hasil =

        dataRumah.filter(
            rumah => {


                // ==========================================
                // SEARCH
                // ==========================================

                const gabunganData = [

                    rumah.id,

                    rumah.alamat,

                    rumah.namaKepalaRumahTangga,

                    rumah.petugasMonitoring,

                    rumah.rt,

                    rumah.rw,

                    rumah.status,

                    rumah.keterangan

                ]

                .filter(
                    value =>
                        value !== null &&
                        value !== undefined
                )

                .join(
                    " "
                )

                .toLowerCase();



                const cocokSearch =

                    gabunganData.includes(
                        keyword
                    );



                // ==========================================
                // RW
                // ==========================================

                const rwRumah =

                    formatNomorWilayah(
                        rumah.rw
                    );


                const cocokRW =

                    !rwDipilih ||

                    rwRumah ===
                    rwDipilih;



                // ==========================================
                // RT
                // ==========================================

                const rtRumah =

                    formatNomorWilayah(
                        rumah.rt
                    );


                const cocokRT =

                    !rtDipilih ||

                    rtRumah ===
                    rtDipilih;



                // ==========================================
                // STATUS
                // ==========================================

                const cocokStatus =

                    !statusDipilih ||

                    rumah.status ===
                    statusDipilih;



                // ==========================================
                // HASIL
                // ==========================================

                return (

                    cocokSearch &&

                    cocokRW &&

                    cocokRT &&

                    cocokStatus

                );


            }
        );



    renderTable(
        hasil
    );

}

// ======================================================

document.addEventListener(
    "click",
    function(
        event
    ) {


        const wrapper =

            document.querySelector(
                ".admin-menu-wrapper"
            );


        const menu =

            document.getElementById(
                "adminDropdown"
            );


        if (
            wrapper &&
            menu &&
            !wrapper.contains(
                event.target
            )
        ) {

            menu.classList.remove(
                "show"
            );

        }


    }
);

        // Isi dropdown RW

);
