<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login MASAGI</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./style/style.css">
</head>


<body class="login-page">

    <div class="login-box">

        <img
            src="./assets/logo-masagi.jpeg"
            alt="Logo MASAGI"
            class="login-logo">


        <h1>
            Angga ganteng luar biasa
        </h1>

        <p class="login-subtitle">
            Silakan masuk menggunakan akun yang telah terdaftar.
        </p>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                autocomplete="email">

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                autocomplete="current-password">

        </div>


        <button
            type="button"
            class="login-button"
            onclick="login()">

            Masuk

        </button>


        <p id="loginError"></p>

    </div>


    <!-- SUPABASE LIBRARY -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- SUPABASE CONFIG -->
    <script
        src="./data/supabase.js">
    </script>


    <!-- AUTH -->
    <script
        src="./data/auth.js">
    </script>


    <script>
        cekSudahLogin();
    </script>

</body>

</html>
